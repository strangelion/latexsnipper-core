# Custom CTC OCR Model Example
#
# This manifest demonstrates how to package a custom CTC-based OCR model
# for use with LaTeXSnipper Core's Model Package architecture.
#
# Place this manifest.toml alongside your model files:
#
#   my-ctc-model/
#   ├── manifest.toml      <- This file
#   ├── model.onnx          <- Your trained ONNX model
#   └── charset.txt         <- Character set (one char per line)

id = "custom/ctc-ocr"
task = "TextRecognition"
version = "1.0.0"
adapter = "ctc-recognition-v1"

[input]
name = "x"
shape = [1, 3, 48, 320]
dtype = "float32"

[[output]]
name = "logits"
shape = [1, 0, 0]
dtype = "float32"

[files]
primary = "model.onnx"
tokenizer = "charset.txt"

[preprocessing]
color_format = "BGR"
mean = [0.5, 0.5, 0.5]
std = [0.5, 0.5, 0.5]

[preprocessing.resize]
width = 320
height = 48
keep_ratio = true

[decoding]
type = "ctc_greedy"
blank_id = 0
