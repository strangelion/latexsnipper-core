[package]
name = "latexsnipper-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
latexsnipper-api-types = { path = "../crates/api-types" }
latexsnipper-ast = { path = "../crates/ast" }
latexsnipper-conversion = { path = "../crates/conversion" }
latexsnipper-model = { path = "../crates/model", default-features = false, features = ["wasm"] }
latexsnipper-plugin = { path = "../crates/plugin" }
latexsnipper-plugin-wasi = { path = "../crates/plugin-wasi" }
latexsnipper-syntax = { path = "../crates/syntax" }
semver = "1"

[[bin]]
name = "format_signature"
path = "fuzz_targets/format_signature.rs"
test = false
doc = false
bench = false

