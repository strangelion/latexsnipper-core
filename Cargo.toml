[workspace]
resolver = "2"
exclude = ["fuzz", "crates/plugin-wasi/fixtures/success-component"]

members = [
    "crates/foundation",
    "crates/ast",
    "crates/tensor",
    "crates/image",
    "crates/runtime",
    "crates/inference",
    "crates/pipeline",
    "crates/syntax",
    "crates/conversion",
    "crates/export",
    "crates/model",
    "crates/engine",
    "crates/api-types",
    "crates/mock",
    "crates/plugin",
    "crates/plugin-wasi",
    "crates/ffi",
    "crates/wasm",
    "crates/cli",
    "crates/tests",
    "crates/tract",
    "crates/evaluation",
    "crates/fidelity",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/strangelion/latexsnipper-core"
homepage = "https://github.com/strangelion/latexsnipper-core"
documentation = "https://github.com/strangelion/latexsnipper-core/tree/main/docs"
readme = "README.md"
keywords = ["ocr", "latex", "math", "formula", "typst"]
categories = ["command-line-utilities", "mathematics", "parser-implementations"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

# Internal crates
latexsnipper-foundation = { path = "crates/foundation", version = "3.0.0" }
latexsnipper-ast = { path = "crates/ast", version = "3.0.0" }
latexsnipper-tensor = { path = "crates/tensor", version = "3.0.0" }
latexsnipper-image = { path = "crates/image", version = "3.0.0", default-features = false }
latexsnipper-runtime = { path = "crates/runtime", version = "3.0.0" }
latexsnipper-inference = { path = "crates/inference", version = "3.0.0" }
latexsnipper-pipeline = { path = "crates/pipeline", version = "3.0.0", default-features = false }
latexsnipper-syntax = { path = "crates/syntax", version = "3.0.0" }
latexsnipper-conversion = { path = "crates/conversion", version = "3.0.0", default-features = false }
latexsnipper-export = { path = "crates/export", version = "3.0.0" }
latexsnipper-model = { path = "crates/model", version = "3.0.0", default-features = false }
latexsnipper-engine = { path = "crates/engine", version = "3.0.0", default-features = false }
latexsnipper-api-types = { path = "crates/api-types", version = "3.0.0" }
latexsnipper-mock = { path = "crates/mock" }
latexsnipper-plugin = { path = "crates/plugin", version = "3.0.0" }
latexsnipper-plugin-wasi = { path = "crates/plugin-wasi", version = "3.0.0" }
latexsnipper-tract = { path = "crates/tract", version = "3.0.0" }
latexsnipper-ffi = { path = "crates/ffi", version = "3.0.0" }
latexsnipper-wasm = { path = "crates/wasm", version = "3.0.0" }
latexsnipper-cli = { path = "crates/cli", version = "3.0.0" }
latexsnipper-tests = { path = "crates/tests", version = "3.0.0" }
latexsnipper-fidelity = { path = "crates/fidelity", version = "3.0.0" }
sha2 = "0.10"
cap-std = "=4.0.2"
cap-fs-ext = "=4.0.2"

[patch.crates-io]
tract-hir = { path = "vendor/tract-hir-0.21.10" }

# Root package for examples and tests
[package]
name = "latexsnipper-core"
version.workspace = true
edition.workspace = true
publish = false
description = "LaTeXSnipper Core — Unified Document AST for multi-format export"

[dependencies]
latexsnipper-ast = { path = "crates/ast" }
latexsnipper-conversion = { path = "crates/conversion" }
latexsnipper-pipeline = { path = "crates/pipeline" }
latexsnipper-engine = { path = "crates/engine", features = ["native"] }
latexsnipper-runtime = { path = "crates/runtime" }
latexsnipper-tensor = { path = "crates/tensor" }
latexsnipper-image = { path = "crates/image" }
latexsnipper-inference = { path = "crates/inference" }
latexsnipper-model = { path = "crates/model" }
latexsnipper-foundation = { path = "crates/foundation" }
latexsnipper-export = { path = "crates/export" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
lopdf = "0.44"

[[example]]
name = "ast_demo"
path = "examples/ast_demo.rs"

[[example]]
name = "conversion_demo"
path = "examples/conversion_demo.rs"

[[example]]
name = "sdk_demo"
path = "examples/sdk_demo.rs"

[[example]]
name = "pipeline_demo"
path = "examples/pipeline_demo.rs"

[[example]]
name = "pdf_export"
path = "examples/pdf_export.rs"

[[example]]
name = "ctc_ocr_model"
path = "examples/ctc_ocr_model/main.rs"

[[example]]
name = "generate_fixtures"
path = "tools/generate_fixtures.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "table_e2e"
path = "tests/table_e2e.rs"
