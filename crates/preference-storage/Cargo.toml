[package]
name = "latexsnipper-preference-storage"
description = "Explicit trusted native preference checkpoint providers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[target.'cfg(windows)'.dependencies]
latexsnipper-conversion.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
fs2 = "=0.4.3"
getrandom = "0.3"
zeroize = "1.9"
hex = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tempfile = "3"
