[package]
name = "latexsnipper-python"
description = "Persistent PyO3 bindings for LaTeXSnipper Core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
latexsnipper-api-types.workspace = true
latexsnipper-ast.workspace = true
latexsnipper-conversion.workspace = true
latexsnipper-engine = { workspace = true, features = ["native"] }
pyo3 = { version = "0.29.2", features = ["macros"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
