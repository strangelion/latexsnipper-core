[package]
name = "latexsnipper-python"
description = "Persistent PyO3 bindings for LaTeXSnipper Core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
latexsnipper-api-types.workspace = true
latexsnipper-ast.workspace = true
latexsnipper-conversion.workspace = true
latexsnipper-ffi.workspace = true
latexsnipper-engine = { workspace = true, features = ["native"] }
pyo3 = { version = "0.29.2", features = ["macros"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }

[features]
default = []
wasi-formula = ["latexsnipper-ffi/wasi-formula"]
protected-preferences = ["dep:latexsnipper-preference-storage"]

[target.'cfg(windows)'.dependencies]
latexsnipper-preference-storage = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
latexsnipper-plugin.workspace = true
wit-component = { version = "0.239.0", features = ["dummy-module"] }
sha2.workspace = true
zip = { version = "0.6", default-features = false, features = ["deflate"] }
