[package]
name = "latexsnipper-runtime"
description = "Runtime abstraction — Session, Provider, ModelHandle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
latexsnipper-foundation.workspace = true
latexsnipper-tensor.workspace = true
latexsnipper-ast.workspace = true
latexsnipper-model.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
ndarray = "0.16"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"

# Remote API provider (optional)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
base64 = { version = "0.22", optional = true }

[features]
default = []
remote-api = ["reqwest", "base64"]

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-native", "api-20", "cuda", "directml"] }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-20", "cuda"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-native", "api-20", "coreml"] }

[dev-dependencies]
latexsnipper-image.workspace = true

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"
