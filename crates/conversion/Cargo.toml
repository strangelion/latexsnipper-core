[package]
name = "latexsnipper-conversion"
description = "Format conversion — AST to LaTeX/OMML/MathML/Typst/Markdown"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
latexsnipper-foundation.workspace = true
latexsnipper-ast.workspace = true
latexsnipper-export = { workspace = true, optional = true }
latexsnipper-syntax.workspace = true
latexsnipper-inference.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
quick-xml = "0.41"
regex = "1"
imagesize = "0.13"
lopdf = { version = "0.44", optional = true }
zip = { version = "0.6", default-features = false, features = ["deflate"], optional = true }
sha2.workspace = true
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }

[features]
default = ["native"]
native = ["dep:latexsnipper-export", "dep:lopdf", "dep:zip", "dep:chrono"]
wasm = []
