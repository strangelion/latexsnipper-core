[package]
name = "latexsnipper-wasm"
description = "WebAssembly bindings — run Core in browsers"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE"
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
latexsnipper-foundation.workspace = true
latexsnipper-api-types.workspace = true
latexsnipper-ast.workspace = true
latexsnipper-image.workspace = true
latexsnipper-model.workspace = true
latexsnipper-runtime.workspace = true
latexsnipper-tensor.workspace = true
latexsnipper-engine = { workspace = true, default-features = false, features = ["wasm"] }
latexsnipper-syntax.workspace = true
latexsnipper-conversion = { workspace = true, default-features = false, features = ["wasm"] }
latexsnipper-tract.workspace = true
serde_json.workspace = true
log.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
once_cell = "1"
sha2.workspace = true

[dev-dependencies]
latexsnipper-inference.workspace = true
wasm-bindgen-test = "0.3"
