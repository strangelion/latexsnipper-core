[package]
name = "latexsnipper-wasm"
description = "WebAssembly bindings — run Core in browsers"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE"
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["recognition"]
# Cargo features are additive: use --no-default-features for the slim profile.
conversion-only = []
recognition = [
    "latexsnipper-api-types/image-input",
    "dep:latexsnipper-image", "dep:latexsnipper-model", "dep:latexsnipper-runtime",
    "dep:latexsnipper-tensor", "dep:latexsnipper-engine", "dep:latexsnipper-tract",
    "dep:latexsnipper-inference", "dep:latexsnipper-syntax", "dep:js-sys",
    "dep:web-sys", "dep:wasm-bindgen-futures", "dep:once_cell", "dep:sha2",
]

[dependencies]
latexsnipper-foundation.workspace = true
# Isolate image-input from the workspace dependency's default feature set.
latexsnipper-api-types = { path = "../api-types", default-features = false }
latexsnipper-ast.workspace = true
latexsnipper-image = { workspace = true, optional = true }
latexsnipper-model = { workspace = true, optional = true }
latexsnipper-runtime = { workspace = true, optional = true }
latexsnipper-tensor = { workspace = true, optional = true }
latexsnipper-engine = { workspace = true, default-features = false, features = ["wasm"], optional = true }
latexsnipper-syntax = { workspace = true, optional = true }
latexsnipper-conversion = { workspace = true, default-features = false, features = ["wasm"] }
latexsnipper-tract = { workspace = true, optional = true }
latexsnipper-inference = { workspace = true, features = ["wasm"], optional = true }
serde_json.workspace = true
log.workspace = true
wasm-bindgen = "0.2"
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["console"], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
once_cell = { version = "1", optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[[test]]
name = "browser"
required-features = ["recognition"]

[[test]]
name = "tiny_models"
required-features = ["recognition"]

[[test]]
name = "production_profiles"
required-features = ["recognition"]
