<!doctype html>
<meta charset="utf-8">
<title>Formula Worker conformance</title>
<link rel="icon" href="data:,">
<pre id="result">Running real browser Worker conversion checks...</pre>
<script type="module">
import { WasmWorkerClient, utf16ToFormulaByteOffset } from "../dist/index.js";
import { fragmentWorkerProof } from "./fragment-worker-browser-proof.mjs";

const verify = (condition, message) => { if (!condition) throw new Error(message); };
const clients = [];
const workerUrl = new URL("../dist/worker-entry.js", import.meta.url);
const profile = new URL(location.href).searchParams.get("profile") ?? "baseline";
const packages = { baseline: "wasm-fragment-web", full: "wasm-full-web", conversion: "wasm-conversion-web" };
if (!Object.hasOwn(packages, profile)) throw new Error("Unknown test WASM profile");
const moduleUrl = new URL(`../../../../target/${packages[profile]}/latexsnipper_wasm.js`, import.meta.url).href;

window.formulaWorkerProof = (async () => {
  try {
    const client = new WasmWorkerClient({ workerUrl, moduleUrl });
    clients.push(client);
    const readyStart = performance.now();
    await client.ready();
    const clientReadyWallMillis = performance.now() - readyStart;
    if (profile === "conversion") {
      const rejected = await client.recognize({ width: 1, height: 1, pixels: new Uint8Array(4), mode: "text" }).then(() => { throw new Error("Slim profile unexpectedly recognized an image"); }, (error) => error);
      verify(rejected.detail.code === "WORKER_RECOGNITION_UNAVAILABLE", "slim recognition refusal");
    }
    const inputs = [
      ["latex", String.raw`\frac{a}{b}`],
      ["typst", "frac(a,b)"],
      ["mathml", "<math><mfrac><mi>a</mi><mi>b</mi></mfrac></math>"],
      ["omml", '<m:oMath xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math"><m:f><m:num><m:r><m:t>a</m:t></m:r></m:num><m:den><m:r><m:t>b</m:t></m:r></m:den></m:f></m:oMath>'],
    ];
    for (const [inputFormat, content] of inputs) {
      const bare = await client.convertFormula({ content, inputFormat, outputFormat: "latex-fragment", mode: "best-effort" });
      verify(bare.ok && bare.data.contentKind === "latex-fragment" && bare.data.content === String.raw`\frac{a}{b}`, `${inputFormat} bare projection`);
      const inline = await client.convertFormula({ content, inputFormat, outputFormat: "markdown_inline", mode: "best-effort" });
      verify(inline.ok && inline.data.content === String.raw`$\frac{a}{b}$`, `${inputFormat} inline projection`);
    }
    const malformed = await client.convertFormula({ content: String.raw`\documentclass{article}x`, inputFormat: "latex", outputFormat: "latex-fragment", mode: "best-effort" });
    verify(!malformed.ok && malformed.error.code === "CONVERSION_FAILED", "document splice refusal");
    const unavailable = await client.convertFormula({ content: "x", inputFormat: "mtef", outputFormat: "omml" });
    verify(!unavailable.ok && unavailable.error.code === "UNSUPPORTED_FORMAT", "unsupported route remains explicit");
    const source = "中😀\\fr";
    const completionInput = { source, inputFormat: "latex", cursor: utf16ToFormulaByteOffset(source, source.length), revision: "18446744073709551615" };
    const suggested = await client.completeFormula(completionInput);
    verify(suggested.ok && suggested.data.snapshot.revision === completionInput.revision, "completion revision precision");
    verify(suggested.data.completion.context.nodes[0].parent === null, "completion null metadata changed");
    const completionApply = { ...completionInput, snapshot: suggested.data.snapshot, candidateId: "builtin:frac" };
    const selected = await client.applyFormulaCompletion(completionApply);
    verify(selected.ok && selected.data.source === "中😀\\frac{}{}" && selected.data.cursor === 13, "completion canonical edit/UTF-8 selection");
    const stale = await client.applyFormulaCompletion({ ...completionApply, revision: "0" });
    verify(!stale.ok && stale.error.code === "STALE_CONTEXT", "stale completion accepted");
    const fenceSource = "中\\left(x";
    const fenceInput = { source: fenceSource, cursor: utf16ToFormulaByteOffset(fenceSource, fenceSource.length), revision: "42", inputFormat: "latex" };
    const fence = await client.completeFormula(fenceInput);
    verify(fence.ok && fence.data.completion.context.slot === "group", "fence owner metadata");
    const fenceClosed = await client.applyFormulaCompletion({ ...fenceInput, snapshot: fence.data.snapshot, candidateId: "structure:close-delimiter" });
    verify(fenceClosed.ok && fenceClosed.data.source === "中\\left(x\\right)", "fence closure transport");
    const sizedSource = "中\\Bigl(x";
    const sizedInput = { source: sizedSource, cursor: utf16ToFormulaByteOffset(sizedSource, sizedSource.length), revision: "42", inputFormat: "latex" };
    const sized = await client.completeFormula(sizedInput);
    const sizedClosed = await client.applyFormulaCompletion({ ...sizedInput, snapshot: sized.data.snapshot, candidateId: "structure:close-delimiter" });
    verify(sizedClosed.ok && sizedClosed.data.source === "中\\Bigl(x\\Bigr)", "sized fence closure transport");
    const starredInput = { source: "\\oper", cursor: 5, revision: "42", inputFormat: "latex" };
    const starred = await client.completeFormula(starredInput);
    const starredEdit = await client.applyFormulaCompletion({ ...starredInput, snapshot: starred.data.snapshot, candidateId: "builtin:operatorname-star" });
    verify(starredEdit.ok && starredEdit.data.source === "\\operatorname*{}", "operator star transport");
    const catalog = { scope: { userSha256: "a".repeat(64), projectSha256: "b".repeat(64), documentSha256: "c".repeat(64), generation: completionInput.revision },
      definitions: [{ id: "pair", revision: completionInput.revision, userSha256: "a".repeat(64), projectSha256: "b".repeat(64), command: "custompair", arguments: ["math", "text"] }] };
    const scopedInput = { ...completionInput, source: "中😀\\cust", cursor: 12, catalog };
    const scoped = await client.completeFormulaScoped(scopedInput);
    verify(scoped.ok && scoped.data.context.schemaVersion === 2 && scoped.data.context.cell === null, "scoped query shape");
    const scopedApply = { ...scopedInput, snapshot: scoped.data.snapshot, candidateId: "definition:pair" };
    const scopedAccepted = await client.applyFormulaCompletionScoped(scopedApply);
    verify(scopedAccepted.ok && scopedAccepted.data.source === "中😀\\custompair{}{}" && scopedAccepted.data.cursor === 19, "scoped canonical edit");
    for (const kind of ["optional-math", "optional-text"]) {
      const optionalCatalog = structuredClone(catalog);
      optionalCatalog.definitions[0].arguments.unshift(kind);
      const optionalInput = { ...scopedInput, catalog: optionalCatalog };
      const optional = await client.completeFormulaScoped(optionalInput);
      verify(optional.ok, "optional signature query");
      const accepted = await client.applyFormulaCompletionScoped({ ...optionalInput, snapshot: optional.data.snapshot, candidateId: "definition:pair:optional" });
      verify(accepted.ok && accepted.data.source === "中😀\\custompair[]{}{}" && accepted.data.tabStops.length === 3, "optional signature acceptance");
    }
    const changed = structuredClone(catalog); changed.scope.generation = "0";
    const scopedStale = await client.applyFormulaCompletionScoped({ ...scopedApply, catalog: changed });
    verify(!scopedStale.ok && scopedStale.error.code === "STALE_CONTEXT", "scoped reset guard");
    const foreign = structuredClone(catalog); foreign.scope.userSha256 = "d".repeat(64);
    const hidden = await client.completeFormulaScoped({ ...scopedInput, catalog: foreign });
    verify(hidden.ok && hidden.data.candidates.length === 0, "foreign definitions leaked");

    let entered;
    let probe;
    const workers = [];
    const lifecycle = new WasmWorkerClient({
      workerUrl,
      moduleUrl: new URL(`./formula-worker-browser-fixture.mjs?profile=${profile}`, import.meta.url).href,
      workerFactory: () => {
        const worker = new Worker(workerUrl, { type: "module" });
        workers.push(worker);
        worker.addEventListener("message", (event) => { if (event.data.stage === "fixture-spin") entered?.(); });
        return worker;
      },
    });
    clients.push(lifecycle);
    await lifecycle.ready();
    const oversized = await lifecycle.convertFormula({ content: "fixture:oversize", inputFormat: "latex", outputFormat: "omml" }).then(() => { throw new Error("Oversized envelope unexpectedly posted"); }, (error) => error);
    verify(oversized.detail.code === "WORKER_RESULT_LIMIT", "worker-side result ceiling");
    for (const cancellation of ["abort", "timeout"]) {
      const signal = new AbortController();
      probe = new Promise((resolve) => { entered = resolve; });
      const stalled = lifecycle.convertFormula({ content: "fixture:infinite", inputFormat: "latex", outputFormat: "omml" }, { signal: signal.signal, timeoutMillis: 1000 });
      const failure = stalled.then(() => { throw new Error("Stalled Wasm unexpectedly completed"); }, (error) => error);
      await probe;
      const before = workers.length;
      if (cancellation === "abort") signal.abort();
      const error = await failure;
      verify(error.detail.code === (cancellation === "abort" ? "CANCELLED" : "WORKER_TASK_TIMEOUT") && error.detail.workerRestarted, `${cancellation} did not hard restart`);
      await lifecycle.ready();
      verify(workers.length === before + 1, `${cancellation} did not create a new Worker`);
      const recovered = await lifecycle.convertFormula({ content: "x^2", inputFormat: "latex", outputFormat: "omml" });
      verify(recovered.ok && recovered.data.content.includes("sSup"), `${cancellation} recovery did not execute Core`);
    }
    const completionOversize = await lifecycle.completeFormula({ source: "fixture:oversize", cursor: 0, revision: "0", inputFormat: "latex" }).then(() => { throw new Error("Oversized completion envelope posted"); }, (error) => error);
    verify(completionOversize.detail.code === "WORKER_RESULT_LIMIT", "completion worker result ceiling");
    for (const cancellation of ["abort", "timeout"]) {
      const signal = new AbortController();
      probe = new Promise((resolve) => { entered = resolve; });
      const stalled = lifecycle.completeFormula({ source: "fixture:infinite", cursor: 0, revision: "0", inputFormat: "latex" }, { signal: signal.signal, timeoutMillis: 1000 });
      const failed = stalled.then(() => { throw new Error("Stalled completion unexpectedly finished"); }, (error) => error);
      await probe;
      const before = workers.length;
      if (cancellation === "abort") signal.abort();
      const reason = await failed;
      verify(reason.detail.code === (cancellation === "abort" ? "CANCELLED" : "WORKER_TASK_TIMEOUT"), "completion cancellation/timeout");
      await lifecycle.ready();
      verify(workers.length === before + 1, "completion did not restart Worker");
      const resumed = await lifecycle.completeFormula(completionInput);
      verify(resumed.ok && resumed.data.snapshot.revision === completionInput.revision, "completion recovery did not execute Core");
    }
    const result = { ok: true, profile, clientReadyWallMillis, projections: 8, refusalCases: 2, workerResultBudget: true, hardCancellation: true, wasmTimeout: true, postRestartCoreConversions: 2, completion: true, completionUtf8: true, completionStaleGuard: true, completionHardAbort: true, completionWasmTimeout: true, host: "browser-only, not Obsidian" };
    const scopedOversize = await lifecycle.completeFormulaScoped({ ...scopedInput, source: "fixture:oversize", cursor: 0 })
      .then(() => { throw new Error("Oversized scoped envelope posted"); }, (error) => error);
    verify(scopedOversize.detail.code === "WORKER_RESULT_LIMIT", "scoped worker result ceiling");
    for (const cancellation of ["abort", "timeout"]) {
      const signal = new AbortController();
      probe = new Promise((resolve) => { entered = resolve; });
      const stalled = lifecycle.completeFormulaScoped({ ...scopedInput, source: "fixture:infinite", cursor: 0 }, { signal: signal.signal, timeoutMillis: 1000 });
      const failed = stalled.then(() => { throw new Error("Stalled scoped completion finished"); }, (error) => error);
      await probe;
      const before = workers.length;
      if (cancellation === "abort") signal.abort();
      const reason = await failed;
      verify(reason.detail.code === (cancellation === "abort" ? "CANCELLED" : "WORKER_TASK_TIMEOUT"), "scoped cancellation/timeout");
      await lifecycle.ready();
      verify(workers.length === before + 1, "scoped Worker not rebuilt");
      const resumed = await lifecycle.completeFormulaScoped(scopedInput);
      verify(resumed.ok && resumed.data.snapshot.definitionsSha256 === scoped.data.snapshot.definitionsSha256, "scoped post-restart Core recovery");
    }
    result.scopedCompletion = true;
    result.scopedHardAbort = true;
    result.scopedWasmTimeout = true;
    Object.assign(result, await fragmentWorkerProof(client, lifecycle, workers, (resolve) => { entered = resolve; }));
    document.querySelector("#result").textContent = JSON.stringify(result, null, 2);
    return result;
  } catch (error) {
    const result = { ok: false, message: error.message, stack: error.stack };
    document.querySelector("#result").textContent = JSON.stringify(result, null, 2);
    return result;
  } finally {
    clients.forEach((client) => client.terminate());
  }
})();
</script>
