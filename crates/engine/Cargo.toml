[package]
name = "latexsnipper-engine"
description = "Core engine — orchestrates all capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
latexsnipper-foundation.workspace = true
latexsnipper-ast.workspace = true
latexsnipper-image = { workspace = true, default-features = false }
latexsnipper-runtime.workspace = true
latexsnipper-runtime-paddle = { workspace = true, optional = true }
latexsnipper-runtime-executorch = { workspace = true, optional = true }
latexsnipper-runtime-tensorrt = { workspace = true, optional = true }
latexsnipper-runtime-coreml = { workspace = true, optional = true }
latexsnipper-runtime-plugin-api = { workspace = true, optional = true }
latexsnipper-inference.workspace = true
latexsnipper-pipeline = { workspace = true, default-features = false }
latexsnipper-model.workspace = true
latexsnipper-api-types.workspace = true
latexsnipper-conversion = { workspace = true, optional = true }
latexsnipper-export = { workspace = true, optional = true }
latexsnipper-incremental = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
sha2.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt"] }

[features]
default = ["native"]
native = [
    "dep:latexsnipper-conversion",
    "latexsnipper-conversion/native",
    "dep:latexsnipper-export",
    "latexsnipper-image/native",
    "latexsnipper-model/native",
    "latexsnipper-pipeline/native",
]
wasm = [
    "latexsnipper-pipeline/wasm",
    "latexsnipper-inference/wasm"
]
remote-api = ["latexsnipper-runtime/remote-api"]
paddle = ["dep:latexsnipper-runtime-paddle"]
executorch = ["dep:latexsnipper-runtime-executorch"]
tensorrt = ["dep:latexsnipper-runtime-tensorrt"]
tensorrt-rtx = ["dep:latexsnipper-runtime-tensorrt"]
coreml = ["dep:latexsnipper-runtime-coreml"]
runtime-plugins = ["dep:latexsnipper-runtime-plugin-api"]
experimental-incremental = ["dep:latexsnipper-incremental"]

[dev-dependencies]
latexsnipper-mock.workspace = true
latexsnipper-syntax.workspace = true
latexsnipper-export.workspace = true
latexsnipper-tensor.workspace = true
tokio = { version = "1", features = ["full"] }
