[package]
name = "latexsnipper-inference"
description = "Inference capability — Detection, Recognition, Layout"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
latexsnipper-foundation.workspace = true
latexsnipper-ast.workspace = true
latexsnipper-image.workspace = true
latexsnipper-runtime.workspace = true
latexsnipper-tensor.workspace = true
latexsnipper-model.workspace = true
tokenizers.workspace = true
serde_json.workspace = true
log.workspace = true
ndarray = "0.16"
regex = "1"

# getrandom 0.3 is pulled transitively through tokenizers/ahash.
# wasm32-unknown-unknown needs the explicit JS backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_03 = {
    package = "getrandom",
    version = "0.3",
    features = ["wasm_js"],
    optional = true
}

[features]
default = []
wasm = ["dep:getrandom_03"]

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[[test]]
name = "tokenizer_parity"
path = "tests/tokenizer_parity.rs"
