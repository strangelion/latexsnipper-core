[package]
name = "latexsnipper-ffi"
description = "FFI bindings — persistent C sessions, Android JNI, and iOS C FFI"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
latexsnipper-foundation.workspace = true
latexsnipper-api-types.workspace = true
latexsnipper-ast.workspace = true
latexsnipper-conversion.workspace = true
latexsnipper-plugin = { workspace = true, optional = true }
latexsnipper-plugin-wasi = { workspace = true, optional = true }
latexsnipper-engine = { workspace = true, features = ["native"] }
latexsnipper-runtime.workspace = true
latexsnipper-image.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
once_cell = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
jni = { version = "0.21", optional = true }

[features]
android-jni = ["dep:jni"]
wasi-formula = ["dep:latexsnipper-plugin", "dep:latexsnipper-plugin-wasi"]
protected-preferences = ["dep:latexsnipper-preference-storage"]

[target.'cfg(windows)'.dependencies]
latexsnipper-preference-storage = { workspace = true, optional = true }

[lib]
crate-type = ["lib", "cdylib"]

[dev-dependencies]
tempfile = "3"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
wit-component = { version = "0.239.0", features = ["dummy-module"] }
sha2.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
