[package]
name = "latexsnipper-pipeline"
description = "LaTeXSnipper Core — one-line image to LaTeX/Markdown/Typst"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
latexsnipper-foundation.workspace = true
latexsnipper-ast.workspace = true
latexsnipper-image.workspace = true
latexsnipper-runtime.workspace = true
latexsnipper-inference.workspace = true
latexsnipper-model.workspace = true
latexsnipper-conversion = { workspace = true, optional = true }
latexsnipper-tensor.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
async-trait = "0.1"
serde_yaml = "0.9"

[features]
default = ["native"]
native = ["dep:latexsnipper-conversion", "latexsnipper-conversion/native"]
wasm = []

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["rt", "macros"] }
