[package]
name = "latexsnipper-worker"
description = "Bounded JSONL process adapter for persistent LaTeXSnipper Core sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
publish = false

[[bin]]
name = "latexsnipper-worker"
path = "src/main.rs"

[dependencies]
latexsnipper-api-types.workspace = true
latexsnipper-ast.workspace = true
latexsnipper-conversion.workspace = true
latexsnipper-foundation.workspace = true
latexsnipper-engine = { workspace = true, features = ["native"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
