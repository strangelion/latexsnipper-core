[package]
name = "latexsnipper-tests"
description = "Unified test suite for all latexsnipper crates"
version.workspace = true
edition.workspace = true
publish = false

[[test]]
name = "all_tests"
path = "src/all_tests.rs"

[[test]]
name = "dual_track"
path = "src/dual_track_tests.rs"

[[test]]
name = "real_model"
path = "src/real_model_tests.rs"

[[test]]
name = "contract_tests"
path = "src/contract_tests.rs"

[[test]]
name = "pipeline_integration"
path = "src/pipeline_integration.rs"

[[test]]
name = "pipeline_e2e"
path = "src/pipeline_e2e.rs"

[dependencies]
latexsnipper-foundation.workspace = true
latexsnipper-ast.workspace = true
latexsnipper-tensor.workspace = true
latexsnipper-image.workspace = true
latexsnipper-runtime.workspace = true
latexsnipper-inference.workspace = true
latexsnipper-pipeline = { workspace = true, features = ["native"] }
latexsnipper-model = { workspace = true, features = ["native"] }
latexsnipper-engine = { workspace = true, features = ["native"] }
latexsnipper-mock.workspace = true
latexsnipper-syntax.workspace = true
latexsnipper-conversion = { workspace = true, features = ["native"] }
latexsnipper-plugin.workspace = true
latexsnipper-export.workspace = true
latexsnipper-ffi.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
once_cell = "1"

[[bench]]
name = "core_bench"
path = "benches/core_bench.rs"
harness = false

[[bench]]
name = "recognition_bench"
path = "benches/recognition_bench.rs"
harness = false
