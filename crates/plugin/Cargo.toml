[package]
name = "latexsnipper-plugin"
description = "Plugin API — extend Core capabilities with standard interfaces"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
latexsnipper-foundation.workspace = true
latexsnipper-ast.workspace = true
serde_json.workspace = true
serde.workspace = true
log.workspace = true
semver = "1"
sha2.workspace = true
hex = "0.4"
tempfile = "3"
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
