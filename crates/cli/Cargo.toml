[package]
name = "latexsnipper-cli"
description = "CLI tool — snipper recognize/export"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "snipper"
path = "src/main.rs"

[dependencies]
latexsnipper-foundation.workspace = true
latexsnipper-ast.workspace = true
latexsnipper-image.workspace = true
latexsnipper-runtime.workspace = true
latexsnipper-engine.workspace = true
latexsnipper-inference.workspace = true
latexsnipper-conversion.workspace = true
latexsnipper-export.workspace = true
latexsnipper-model.workspace = true
latexsnipper-pipeline.workspace = true
latexsnipper-syntax.workspace = true
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde_json.workspace = true
log.workspace = true
env_logger = "0.11"
