name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # Job 1: Build CLI binaries
  # ============================================================
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: snipper-linux-amd64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: snipper-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build
        run: cargo build --release -p latexsnipper-cli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz snipper
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/snipper.exe `
            -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  # ============================================================
  # Job 2: Test SDK
  # ============================================================
  test-sdk:
    name: Test SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: sdk

      - name: Test
        run: cargo test --workspace

  # ============================================================
  # Job 2.5: Dry-run publish
  # ============================================================
  dry-run:
    name: Dry-run publish
    needs: test-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dry-run all crates
        run: |
          for crate in \
            latexsnipper-foundation \
            latexsnipper-ast \
            latexsnipper-tensor \
            latexsnipper-image \
            latexsnipper-syntax \
            latexsnipper-conversion \
            latexsnipper-export \
            latexsnipper-model \
            latexsnipper-runtime \
            latexsnipper-inference \
            latexsnipper-api-types \
            latexsnipper-pipeline \
            latexsnipper-engine
          do
            echo "Dry-run: $crate"
            cargo publish -p $crate --dry-run
          done

  # ============================================================
  # Job 3: Publish to crates.io (in dependency order)
  # ============================================================
  publish-crates:
    name: Publish to crates.io
    needs: [test-sdk, dry-run]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check version consistency
        run: |
          VERSION="$(grep '^version =' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Cargo.toml version ($VERSION) does not match tag version (v$TAG_VERSION)"
            exit 1
          fi
          echo "Version consistent: $VERSION"

      - name: Publish foundation
        run: cargo publish -p latexsnipper-foundation
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish ast
        run: cargo publish -p latexsnipper-ast
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish tensor
        run: cargo publish -p latexsnipper-tensor
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish image
        run: cargo publish -p latexsnipper-image
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish syntax
        run: cargo publish -p latexsnipper-syntax
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish conversion
        run: cargo publish -p latexsnipper-conversion
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish export
        run: cargo publish -p latexsnipper-export
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish model
        run: cargo publish -p latexsnipper-model
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish runtime
        run: cargo publish -p latexsnipper-runtime
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish inference
        run: cargo publish -p latexsnipper-inference
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish api-types
        run: cargo publish -p latexsnipper-api-types
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish pipeline
        run: cargo publish -p latexsnipper-pipeline
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish engine
        run: cargo publish -p latexsnipper-engine
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ============================================================
  # Job 4: Create CLI Release
  # ============================================================
  release-cli:
    name: Release CLI
    needs: [build-cli, test-sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Release ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          body: |
            ## Install

            ### From crates.io

            ```bash
            cargo install latexsnipper-cli
            ```

            ### From Binary

            Download the archive for your platform and extract it.

            ### As Library

            ```toml
            [dependencies]
            latexsnipper-pipeline = "${{ steps.version.outputs.version }}"
            ```

            ## Usage

            ```bash
            # Parse LaTeX
            snipper parse --latex '$\frac{a+b}{c}$'

            # Recognize from image and export to file
            snipper recognize -i image.png -f latex -o output.tex

            # See all options
            snipper --help
            ```
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
