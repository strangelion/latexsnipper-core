name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # Job 1: Build CLI binaries
  # ============================================================
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: snipper-linux-amd64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: snipper-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build
        run: cargo build --release -p latexsnipper-cli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz snipper
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/snipper.exe `
            -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  # ============================================================
  # Job 2: Test SDK
  # ============================================================
  test-sdk:
    name: Test SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: sdk

      - name: Test
        run: cargo test --workspace

  # ============================================================
  # Job 2.5: Dry-run publish
  # ============================================================
  dry-run:
    name: Dry-run publish
    needs: test-sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dry-run leaf crates (no internal deps)
        run: |
          for crate in latexsnipper-foundation latexsnipper-ast latexsnipper-tensor; do
            echo "Dry-run: $crate"
            cargo publish -p $crate --dry-run
          done

      - name: Dry-run dependent crates (best-effort)
        continue-on-error: true
        run: |
          for crate in \
            latexsnipper-model latexsnipper-image latexsnipper-runtime \
            latexsnipper-syntax latexsnipper-export latexsnipper-conversion \
            latexsnipper-inference latexsnipper-api-types \
            latexsnipper-pipeline latexsnipper-engine
          do
            echo "Dry-run: $crate"
            cargo publish -p $crate --dry-run || true
          done

  # ============================================================
  # Job 3: Publish to crates.io (in dependency order)
  # ============================================================
  publish-crates:
    name: Publish to crates.io
    needs: [test-sdk, dry-run]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check version consistency
        run: |
          VERSION="$(grep '^version =' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Cargo.toml version ($VERSION) does not match tag version (v$TAG_VERSION)"
            exit 1
          fi
          echo "Version consistent: $VERSION"
        
      - name: Publish crates
        run: |
          publish() {
              local crate=$1
              echo "=== Publishing $crate ==="
              set +e
              cargo publish -p "$crate" 2>&1 | tee /tmp/pub.log
              exit_code=${PIPESTATUS[0]}
              set -e
              if [ $exit_code -eq 0 ]; then
                echo "Published $crate"
                sleep 30
                return 0
              fi
              if grep -Ei "already uploaded|already exists|is already uploaded|crate version.*already" /tmp/pub.log; then
                echo "Skipping $crate — this version is already published"
                sleep 5
                return 0
              fi
              echo "ERROR: failed to publish $crate"
              exit $exit_code
            }
            publish latexsnipper-foundation
            publish latexsnipper-ast
            publish latexsnipper-tensor
            publish latexsnipper-model
            publish latexsnipper-image
            publish latexsnipper-runtime
            publish latexsnipper-syntax
            publish latexsnipper-export
            publish latexsnipper-conversion
            publish latexsnipper-inference
            publish latexsnipper-api-types
            publish latexsnipper-pipeline
            publish latexsnipper-engine
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ============================================================
  # Job 4: Create CLI Release
  # ============================================================
  release-cli:
    name: Release CLI
    needs: [build-cli, publish-crates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Release ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          body: |
            ## Install

            ### From Binary

            Download the archive for your platform and extract it.

            ### As Library

            ```toml
            [dependencies]
            latexsnipper-pipeline = "2.0.0"
            ```

            ## Usage

            ```bash
            # Parse LaTeX
            snipper parse --latex '$\frac{a+b}{c}$'

            # Recognize from image and export to file
            snipper recognize -i image.png -f latex -o output.tex

            # See all options
            snipper --help
            ```
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
