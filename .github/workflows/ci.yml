name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features

  focused-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Package validation
            command: cargo test -p latexsnipper-conversion package_export
          - name: Parser security and fuzz smoke
            command: cargo test -p latexsnipper-conversion importer::tests
          - name: Round-trip corpus
            command: cargo test --test conversion_roundtrip
          - name: CLI smoke
            command: cargo test -p latexsnipper-cli --test cli_convert
          - name: Plugin lifecycle and package management
            command: cargo test -p latexsnipper-plugin
          - name: V3 contracts and migrations
            command: cargo test -p latexsnipper-foundation -p latexsnipper-api-types -p latexsnipper-plugin -p latexsnipper-model
          - name: WASI Component isolation
            command: cargo test -p latexsnipper-plugin-wasi
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ${{ matrix.command }}

  benchmark-smoke:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p latexsnipper-tests --bench core_bench

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  fuzz-build:
    name: Compile all fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz build

  diff-size-advisory:
    name: Large diff review advisory
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Report unusually large pull requests
        shell: bash
        run: |
          stats="$(git diff --numstat "origin/${GITHUB_BASE_REF}...HEAD")"
          files="$(printf '%s\n' "$stats" | sed '/^$/d' | wc -l)"
          lines="$(printf '%s\n' "$stats" | awk '$1 != "-" && $2 != "-" { total += $1 + $2 } END { print total + 0 }')"
          {
            echo '### Pull request diff size'
            echo
            echo "- Changed files: $files"
            echo "- Added and removed lines: $lines"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$files" -gt 80 ] || [ "$lines" -gt 5000 ]; then
            echo "::warning::Large subsystem change detected ($files files, $lines lines). Request explicit security, ABI, model, and platform review as applicable."
          fi

  docs:
    name: Documentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --doc --workspace --all-features

  feature-matrix:
    name: Feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p latexsnipper-runtime --no-default-features
      - run: cargo check -p latexsnipper-runtime --features remote-api
      - run: cargo check -p latexsnipper-cli --all-targets

  real-model-windows:
    name: Real models (Windows CPU)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      LATEXSNIPPER_REQUIRE_REAL_MODELS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test verified downloader
        shell: pwsh
        run: ./scripts/tests/VerifiedDownload.Tests.ps1
      - name: Cache verified model archives
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/latexsnipper-model-cache
          key: real-models-${{ runner.os }}-${{ hashFiles('scripts/model-manifest.template.json', 'scripts/VerifiedDownload.psm1', 'scripts/setup-real-model-tests.ps1') }}
      - name: Download and verify model assets
        shell: pwsh
        run: ./scripts/setup-real-model-tests.ps1
      - name: Run text, formula, orientation, and multi-model tests
        run: cargo test -p latexsnipper-tests --test real_model -- --nocapture
      - name: Run real-model pipeline integration tests
        run: cargo test -p latexsnipper-tests --test pipeline_integration -- --nocapture
      - name: Run full recognition pipeline tests
        run: cargo test -p latexsnipper-tests --test pipeline_e2e -- --nocapture
      - name: Run table recognition test
        run: cargo test --test table_e2e -- --nocapture
      - name: Upload model setup diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: real-model-setup-diagnostics-${{ runner.os }}
          path: ${{ runner.temp }}/latexsnipper-model-diagnostics
          if-no-files-found: warn
          retention-days: 14

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
