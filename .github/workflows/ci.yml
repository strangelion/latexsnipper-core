name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --all-features

  coreml-contract:
    name: Core ML native contract
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p latexsnipper-runtime-coreml --all-targets

  focused-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Package validation
            command: cargo test --locked -p latexsnipper-conversion package_export
          - name: Parser security and fuzz smoke
            command: cargo test --locked -p latexsnipper-conversion importer::tests
          - name: Round-trip corpus
            command: cargo test --locked --test conversion_roundtrip
          - name: CLI smoke
            command: cargo test --locked -p latexsnipper-cli --test cli_convert
          - name: Plugin lifecycle and package management
            command: cargo test --locked -p latexsnipper-plugin
          - name: V3 contracts and migrations
            command: cargo test --locked -p latexsnipper-foundation -p latexsnipper-api-types -p latexsnipper-plugin -p latexsnipper-model
          - name: WASI Component isolation
            command: cargo test --locked -p latexsnipper-plugin-wasi
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ${{ matrix.command }}

  benchmark-smoke:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --locked -p latexsnipper-tests --bench core_bench

  incremental-contract:
    name: Incremental contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p latexsnipper-benchmark
      - run: >-
          cargo run --locked -p latexsnipper-benchmark --
          --golden-case benchmark/golden/incremental/formula-edit-v1

  ocr-evidence-contract:
    name: OCR evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate corpora and generate non-production contract predictions
        shell: bash
        run: |
          cargo run --locked -p latexsnipper-evaluation --bin ocr-eval -- \
            validate --index evaluation/corpora/index.json
          cargo run --locked -p latexsnipper-evaluation --bin ocr-eval -- \
            contract-predictions \
            --index evaluation/corpora/index.json \
            --tier pull-request \
            --model-spec evaluation/contract-oracle-v1.json \
            --output target/evaluation/contract-predictions.json
      - name: Calculate metrics and enforce the contract gates
        shell: bash
        run: |
          cargo run --locked -p latexsnipper-evaluation --bin ocr-eval -- \
            evaluate \
            --index evaluation/corpora/index.json \
            --predictions target/evaluation/contract-predictions.json \
            --gates evaluation/gates/pull-request.json \
            --tier pull-request \
            --source-commit "$GITHUB_SHA" \
            --generated-at-utc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output target/evaluation/pull-request-evidence.json
      - uses: actions/upload-artifact@v7
        with:
          name: ocr-evidence-contract-${{ github.run_id }}
          path: target/evaluation/pull-request-evidence.json
          if-no-files-found: error
          retention-days: 30

  office-pdf-fidelity:
    name: Office and PDF fidelity evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate golden corpora
        run: >-
          cargo run --locked -p latexsnipper-fidelity --bin fidelity-check --
          validate --index fidelity/corpora/index.json --repository-root .
      - name: Run fidelity evidence gates
        run: >-
          cargo run --locked -p latexsnipper-fidelity --bin fidelity-check --
          run --index fidelity/corpora/index.json --repository-root .
          --source-commit "$GITHUB_SHA"
          --generated-at-utc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          --output target/fidelity/report.json
      - name: Verify generated capability documentation
        run: |
          cargo run --locked -p latexsnipper-fidelity --bin generate-fidelity-capabilities -- \
            --output docs/generated/fidelity-capabilities.md
          git diff --exit-code -- docs/generated/fidelity-capabilities.md
      - name: Upload fidelity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: office-pdf-fidelity-${{ github.run_id }}
          path: target/fidelity/report.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload visual failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: office-pdf-visual-failures-${{ github.run_id }}
          path: target/fidelity/visual
          if-no-files-found: warn
          retention-days: 30

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  runtime-quality-evidence:
    name: Runtime quality evidence
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Collect machine-readable gates
        run: >-
          python tools/quality/collect_test_evidence.py
          --output target/runtime-quality/test-evidence.json
      - name: Upload runtime quality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-quality-evidence-${{ github.run_id }}
          path: target/runtime-quality/test-evidence.json
          if-no-files-found: error
          retention-days: 30

  provider-cpu-smoke:
    name: Provider CPU smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run fixed-model CPU session and inference
        run: >-
          cargo run --locked -p latexsnipper-runtime --example provider_smoke --
          contracts/fixtures/provider-smoke-v1.json
          target/provider-smoke.json cpu cpu
      - name: Upload provider smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provider-cpu-smoke-${{ matrix.os }}-${{ github.run_id }}
          path: target/provider-smoke.json
          if-no-files-found: error
          retention-days: 30

  contract-runtime:
    name: contract-runtime
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/run_agent_contracts.py --suite runtime
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-runtime-${{ github.run_id }}
          path: artifacts/contracts/contract-runtime.*
          if-no-files-found: error

  contract-provider:
    name: contract-provider
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/run_agent_contracts.py --suite provider
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-provider-${{ github.run_id }}
          path: artifacts/contracts/contract-provider.*
          if-no-files-found: error

  contract-ort128:
    name: contract-ort128
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/run_agent_contracts.py --suite ort128
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-ort128-${{ github.run_id }}
          path: artifacts/contracts/contract-ort128.*
          if-no-files-found: error

  contract-int8:
    name: contract-int8
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/run_agent_contracts.py --suite int8
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-int8-${{ github.run_id }}
          path: artifacts/contracts/contract-int8.*
          if-no-files-found: error

  contract-conversion:
    name: contract-conversion
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/run_agent_contracts.py --suite conversion
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-conversion-${{ github.run_id }}
          path: artifacts/contracts/contract-conversion.*
          if-no-files-found: error

  contract-office-output:
    name: contract-office-output
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/run_agent_contracts.py --suite office-output
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-office-output-${{ github.run_id }}
          path: artifacts/contracts/contract-office-output.*
          if-no-files-found: error

  contract-failure-corpus:
    name: contract-failure-corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/run_agent_contracts.py --suite failure-corpus
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-failure-corpus-${{ github.run_id }}
          path: artifacts/contracts/contract-failure-corpus.*
          if-no-files-found: error

  contract-model-package-security:
    name: contract-model-package-security
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/run_agent_contracts.py --suite model-package-security
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-model-package-security-${{ github.run_id }}
          path: artifacts/contracts/contract-model-package-security.*
          if-no-files-found: error

  contract-drawing:
    name: contract-drawing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/run_agent_contracts.py --suite drawing
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-drawing-${{ github.run_id }}
          path: artifacts/contracts/contract-drawing.*
          if-no-files-found: error

  fuzz-build:
    name: Compile all fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz build

  diff-size-advisory:
    name: Large diff review advisory
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Report unusually large pull requests
        shell: bash
        run: |
          stats="$(git diff --numstat "origin/${GITHUB_BASE_REF}...HEAD")"
          files="$(printf '%s\n' "$stats" | sed '/^$/d' | wc -l)"
          lines="$(printf '%s\n' "$stats" | awk '$1 != "-" && $2 != "-" { total += $1 + $2 } END { print total + 0 }')"
          {
            echo '### Pull request diff size'
            echo
            echo "- Changed files: $files"
            echo "- Added and removed lines: $lines"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$files" -gt 80 ] || [ "$lines" -gt 5000 ]; then
            echo "::warning::Large subsystem change detected ($files files, $lines lines). Request explicit security, ABI, model, and platform review as applicable."
          fi

  docs:
    name: Documentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --doc --workspace --all-features

  feature-matrix:
    name: Feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p latexsnipper-runtime --no-default-features
      - run: cargo check --locked -p latexsnipper-runtime --features remote-api
      - run: cargo check --locked -p latexsnipper-cli --all-targets
      - run: cargo check --locked -p latexsnipper-engine --no-default-features
      - run: >-
          cargo check --locked -p latexsnipper-engine --no-default-features
          --features experimental-incremental

  real-model-windows:
    name: Real models (Windows CPU)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      LATEXSNIPPER_REQUIRE_REAL_MODELS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test verified downloader
        shell: pwsh
        run: ./scripts/tests/VerifiedDownload.Tests.ps1
      - name: Cache verified model archives
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/latexsnipper-model-cache
          key: real-models-${{ runner.os }}-${{ hashFiles('scripts/real-model-test-assets.json', 'scripts/model-manifest.template.json', 'scripts/VerifiedDownload.psm1', 'scripts/setup-real-model-tests.ps1') }}
      - name: Download and verify model assets
        shell: pwsh
        run: ./scripts/setup-real-model-tests.ps1
      - name: Run text, formula, orientation, and multi-model tests
        run: cargo test --locked -p latexsnipper-tests --test real_model -- --nocapture
      - name: Run real-model pipeline integration tests
        run: cargo test --locked -p latexsnipper-tests --test pipeline_integration -- --nocapture
      - name: Run full recognition pipeline tests
        run: cargo test --locked -p latexsnipper-tests --test pipeline_e2e -- --nocapture
      - name: Run table recognition test
        run: cargo test --locked --test table_e2e -- --nocapture
      - name: Upload model setup diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: real-model-setup-diagnostics-${{ runner.os }}
          path: ${{ runner.temp }}/latexsnipper-model-diagnostics
          if-no-files-found: warn
          retention-days: 14

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace

  release-contract:
    name: Release version and frozen contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: python scripts/verify_release_version.py
      - run: python scripts/verify_v3_contract_freeze.py
      - run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
