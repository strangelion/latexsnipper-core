name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Cache models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: models
          key: models-v2.0.0

      - name: Download and extract models
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          BASE_URL="https://github.com/strangelion/latexsnipper-core/releases/download/models-v2.0.0"
          ZIPS=(
            latexsnipper-formula-det
            latexsnipper-formula-rec
            latexsnipper-text-det
            latexsnipper-text-rec
            latexsnipper-table-det
            latexsnipper-table-struct
          )
          mkdir -p models
          for zip in "${ZIPS[@]}"; do
            echo "Downloading $zip..."
            curl -sSL "$BASE_URL/$zip.zip" -o "/tmp/$zip.zip"
            unzip -q -o "/tmp/$zip.zip" -d models/
            rm "/tmp/$zip.zip"
          done
          echo "Models extracted to models/"

      - run: cargo test --workspace
      - run: cargo test --workspace --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-features -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
