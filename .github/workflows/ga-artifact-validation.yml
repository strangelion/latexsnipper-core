name: GA artifact validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ga-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_PACK_VERSION: 0.13.1

jobs:
  preflight:
    name: Release and contract preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify version and frozen contracts
        run: |
          python scripts/verify_release_version.py
          python scripts/verify_v3_contract_freeze.py
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Audit dependencies with reviewed exceptions
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings

  cli-packages:
    name: Installed CLI (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: snipper-linux-amd64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: snipper-windows-amd64.zip
          - target: aarch64-apple-darwin
            os: macos-15
            archive: snipper-macos-arm64.tar.gz
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ga-cli-${{ matrix.target }}
      - run: cargo build --locked --release -p latexsnipper-cli --target ${{ matrix.target }}
      - name: Package and test installed archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p target/ga-stage target/ga-install
          cp "target/${{ matrix.target }}/release/snipper" target/ga-stage/
          cp LICENSE README.md target/ga-stage/

          tar -C target/ga-stage -czf "${{ matrix.archive }}" .

          tar -C target/ga-install -xzf "${{ matrix.archive }}"

          target/ga-install/snipper version

          target/ga-install/snipper capabilities --format json \
            > target/ga-install/capabilities.json

          python -c 'import json; json.load(open("target/ga-install/capabilities.json", encoding="utf-8"))'
      - name: Package and test installed archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/ga-stage, target/ga-install | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/snipper.exe" target/ga-stage/
          Copy-Item LICENSE, README.md target/ga-stage/
          Compress-Archive -Path target/ga-stage/* -DestinationPath "${{ matrix.archive }}"
          Expand-Archive -Path "${{ matrix.archive }}" -DestinationPath target/ga-install
          & target/ga-install/snipper.exe version
          & target/ga-install/snipper.exe capabilities --format json `
            | Set-Content -Encoding utf8 target/ga-install/capabilities.json
          Get-Content -Raw target/ga-install/capabilities.json | ConvertFrom-Json | Out-Null
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  rust-packages:
    name: Rust package manifests and leaf archives
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build publishable leaf archives
        shell: bash
        run: |
          leaf_crates=(latexsnipper-foundation latexsnipper-ast latexsnipper-tensor)
          for crate in "${leaf_crates[@]}"; do
            cargo package --locked -p "$crate"
          done
          test "$(find target/package -maxdepth 1 -name '*.crate' | wc -l)" -eq "${#leaf_crates[@]}"
      - name: Verify dependent package contents
        shell: bash
        run: |
          mkdir -p target/package-lists
          dependent_crates=(
            latexsnipper-model latexsnipper-image latexsnipper-runtime
            latexsnipper-syntax latexsnipper-export latexsnipper-conversion
            latexsnipper-inference latexsnipper-api-types latexsnipper-pipeline
            latexsnipper-engine
          )
          for crate in "${dependent_crates[@]}"; do
            cargo package --locked --list -p "$crate" > "target/package-lists/$crate.txt"
            test -s "target/package-lists/$crate.txt"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: rust-crate-archives
          path: |
            target/package/*.crate
            target/package-lists/*.txt
          if-no-files-found: error

  wasm-packages:
    name: Installed WASM and TypeScript packages
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/wasm/js/package-lock.json
      - run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
      - name: Build target-specific WASM packages
        run: |
          wasm-pack build crates/wasm --target web --release --out-dir ../../target/wasm-web --locked
          wasm-pack build crates/wasm --target bundler --release --out-dir ../../target/wasm-bundler --locked
          wasm-pack build crates/wasm --target nodejs --release --out-dir ../../target/wasm-nodejs --locked
          cp LICENSE target/wasm-web/
          cp LICENSE target/wasm-bundler/
          cp LICENSE target/wasm-nodejs/
      - name: Build and test TypeScript adapter
        working-directory: crates/wasm/js
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm test
          npm run build
          npm run build:example
          npm run smoke:packages
      - name: Pack and install package archives
        shell: bash
        run: |
          mkdir -p target/npm-packages target/npm-consumer
          package="$(npm pack ./target/wasm-web --pack-destination target/npm-packages | tail -n 1)"
          mv "target/npm-packages/$package" target/npm-packages/latexsnipper-wasm-web.tgz
          package="$(npm pack ./target/wasm-bundler --pack-destination target/npm-packages | tail -n 1)"
          mv "target/npm-packages/$package" target/npm-packages/latexsnipper-wasm-bundler.tgz
          package="$(npm pack ./target/wasm-nodejs --pack-destination target/npm-packages | tail -n 1)"
          mv "target/npm-packages/$package" target/npm-packages/latexsnipper-wasm-nodejs.tgz
          npm pack ./crates/wasm/js --pack-destination target/npm-packages
          cd target/npm-consumer
          npm init -y
          npm install ../npm-packages/latexsnipper-wasm-nodejs.tgz
          node -e 'const wasm = require("latexsnipper-wasm"); if (!wasm.api_info_v3) process.exit(1)'
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-npm-archives
          path: target/npm-packages/*.tgz
          if-no-files-found: error

  bundle:
    name: Checksums and provenance bundle
    needs: [cli-packages, rust-packages, wasm-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: target/ga-artifacts
      - name: Generate deterministic inventory
        shell: bash
        run: |
          git rev-parse HEAD > target/ga-artifacts/SOURCE_COMMIT
          python scripts/verify_release_version.py \
            > target/ga-artifacts/VERSION_VALIDATION.txt
          find target/ga-artifacts -type f \
            ! -name SHA256SUMS ! -name ARTIFACTS.txt -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum \
            > target/ga-artifacts/SHA256SUMS
          find target/ga-artifacts -type f \
            ! -name SHA256SUMS ! -name ARTIFACTS.txt -printf '%P\n' \
            | LC_ALL=C sort > target/ga-artifacts/ARTIFACTS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ga-installable-bundle
          path: target/ga-artifacts
          if-no-files-found: error
          retention-days: 30
