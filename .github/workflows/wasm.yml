name: WASM

on:
  push:
    branches: [main, develop, wasm]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_PACK_VERSION: 0.13.1

jobs:
  quality:
    name: WASM fmt, check, and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check isolated WASM engine
        run: >-
          cargo check -p latexsnipper-engine --no-default-features
          --features wasm --target wasm32-unknown-unknown
      - name: Check WASM package
        run: cargo check -p latexsnipper-wasm --all-targets --target wasm32-unknown-unknown
      - name: Lint WASM package
        run: cargo clippy -p latexsnipper-wasm --all-targets --target wasm32-unknown-unknown -- -D warnings

  package:
    name: Build and package WASM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
      - name: Build web package
        run: >-
          wasm-pack build crates/wasm --target web --release
          --out-dir ../../target/wasm-web
      - name: Build bundler package
        run: >-
          wasm-pack build crates/wasm --target bundler --release
          --out-dir ../../target/wasm-bundler
      - name: Build Node package
        run: >-
          wasm-pack build crates/wasm --target nodejs --release
          --out-dir ../../target/wasm-node
      - name: Record package sizes
        run: |
          find target/wasm-web -maxdepth 1 -type f -printf '%f %s bytes\n' | sort | tee target/wasm-web/size-report.txt
      - name: Smoke-test npm package metadata
        working-directory: target/wasm-web
        run: npm pack --dry-run
      - name: Smoke-test ESM and Node imports
        run: node crates/wasm/js/scripts/package-smoke.mjs
      - name: Upload browser package
        uses: actions/upload-artifact@v7
        with:
          name: latexsnipper-wasm-web
          path: target/wasm-web
          if-no-files-found: error
          retention-days: 14

  browser-tests:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
      - name: Run headless browser tests with one retry
        run: |
          for attempt in 1 2; do
            wasm-pack test --headless --${{ matrix.browser }} crates/wasm && exit 0
            test "$attempt" = 1 || exit 1
            echo "Retrying ${{ matrix.browser }} after first failure"
          done
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-${{ matrix.browser }}-diagnostics-${{ github.run_id }}
          path: |
            target/wasm32-unknown-unknown/debug
            target/wasm-bindgen-test*
          if-no-files-found: warn
          retention-days: 14

  typescript-runtime:
    name: Worker, Node, TypeScript, and Vite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/wasm/js
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/wasm/js/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:example
      - name: Upload TypeScript declarations and example
        uses: actions/upload-artifact@v7
        with:
          name: latexsnipper-wasm-worker-${{ github.run_id }}
          path: |
            crates/wasm/js/dist
            crates/wasm/js/example/dist
          if-no-files-found: error
          retention-days: 14
