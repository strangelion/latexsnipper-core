name: WASM

on:
  push:
    branches: [main, develop, wasm]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_PACK_VERSION: 0.13.1

jobs:
  quality:
    name: WASM fmt, check, and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check isolated WASM engine
        run: >-
          cargo check --locked -p latexsnipper-engine --no-default-features
          --features wasm --target wasm32-unknown-unknown
      - name: Check WASM package
        run: cargo check --locked -p latexsnipper-wasm --all-targets --target wasm32-unknown-unknown
      - name: Lint WASM package
        run: cargo clippy --locked -p latexsnipper-wasm --all-targets --target wasm32-unknown-unknown -- -D warnings

  package:
    name: Build and package WASM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/wasm/js/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Install package smoke dependencies
        working-directory: crates/wasm/js
        run: npm ci
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
      - name: Build web package
        run: >-
          wasm-pack build crates/wasm --target web --release
          --out-dir ../../target/wasm-web --locked
      - name: Build bundler package
        run: >-
          wasm-pack build crates/wasm --target bundler --release
          --out-dir ../../target/wasm-bundler --locked
      - name: Build Node package
        run: >-
          wasm-pack build crates/wasm --target nodejs --release
          --out-dir ../../target/wasm-nodejs --locked
      - name: Include license in generated npm packages
        run: |
          cp LICENSE target/wasm-web/LICENSE
          cp LICENSE target/wasm-bundler/LICENSE
          cp LICENSE target/wasm-nodejs/LICENSE
      - name: Record package sizes
        run: |
          find target/wasm-web -maxdepth 1 -type f -printf '%f %s bytes\n' | sort | tee target/wasm-web/size-report.txt
      - name: Smoke-test npm package metadata
        working-directory: target/wasm-web
        run: npm pack --dry-run
      - name: Smoke-test ESM and Node imports
        working-directory: crates/wasm/js
        run: npm run smoke:packages
      - name: Upload browser package
        uses: actions/upload-artifact@v7
        with:
          name: latexsnipper-wasm-web
          path: target/wasm-web
          if-no-files-found: error
          retention-days: 14

  browser-tests:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
      - name: Run headless browser tests with one retry
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/browser-test-logs

          for attempt in 1 2; do
            log="target/browser-test-logs/${{ matrix.browser }}-attempt-${attempt}.log"

            if wasm-pack test \
                --release \
                --headless \
                --${{ matrix.browser }} \
                crates/wasm \
                2>&1 | tee "$log"; then
              exit 0
            fi

            if [ "$attempt" = "2" ]; then
              exit 1
            fi

            echo "Retrying ${{ matrix.browser }} after first failure"
          done
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-${{ matrix.browser }}-diagnostics-${{ github.run_id }}
          path: |
            target/browser-test-logs
            target/wasm-bindgen-test*
          if-no-files-found: warn
          retention-days: 14

  production-handwriting:
    name: Production TrOCR compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODEL_ARCHIVE: target/test-models/latexsnipper-formula-rec.zip
      MODEL_SHA256: fdcc414b9073c73325614faafc6473ddd7e91a80305cdc55f7267195de152a21
      MODEL_URL: https://github.com/strangelion/latexsnipper-core/releases/download/models-v2.0.0/latexsnipper-formula-rec.zip
      LATEXSNIPPER_REQUIRE_REAL_MODELS: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache checksum-verified TrOCR archive
        uses: actions/cache@v5
        with:
          path: target/test-models
          key: trocr-deit-${{ env.MODEL_SHA256 }}
      - name: Download, verify, and extract TrOCR
        shell: bash
        run: |
          mkdir -p "$(dirname "$MODEL_ARCHIVE")" models/formula-rec
          if [ ! -f "$MODEL_ARCHIVE" ]; then
            curl --fail --location --retry 3 --max-redirs 5 \
              --output "$MODEL_ARCHIVE.part" "$MODEL_URL"
            mv "$MODEL_ARCHIVE.part" "$MODEL_ARCHIVE"
          fi
          echo "$MODEL_SHA256  $MODEL_ARCHIVE" | sha256sum --check --strict
          unzip_exit=0
          unzip -q -o "$MODEL_ARCHIVE" -d models/formula-rec || unzip_exit=$?
          if [ "$unzip_exit" -gt 1 ]; then
            exit "$unzip_exit"
          fi
          for artifact in config.json encoder_model.onnx decoder_model.onnx tokenizer.json; do
            test -f "models/formula-rec/trocr-deit/$artifact"
          done
      - name: Execute production TrOCR with the browser runtime
        run: >-
          cargo test --locked -p latexsnipper-wasm --test production_profiles --
          --exact production_handwriting_profile_executes_with_the_wasm_runtime
          --nocapture

  typescript-runtime:
    name: Worker, Node, TypeScript, and Vite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/wasm/js
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/wasm/js/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:example
      - name: Upload TypeScript declarations and example
        uses: actions/upload-artifact@v7
        with:
          name: latexsnipper-wasm-worker-${{ github.run_id }}
          path: |
            crates/wasm/js/dist
            crates/wasm/js/example/dist
          if-no-files-found: error
          retention-days: 14
