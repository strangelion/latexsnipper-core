name: Model Release

on:
  push:
    tags:
      - 'models-v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version tag override (e.g. models-v2.0.0)'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # Job 1: Verify model fixtures are available
  # ============================================================
  check-models:
    name: Check model fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CLI
        uses: dtolnay/rust-toolchain@stable

      - name: Build cli binary
        run: cargo build --release -p latexsnipper-cli

      - name: Verify model-manifest exists
        run: |
          if [ ! -f models/model-manifest.json ]; then
            echo "ERROR: models/model-manifest.json not found"
            exit 1
          fi
          echo "Manifest version: $(jq -r .version models/model-manifest.json)"
          echo "Categories: $(jq -r '.categories | keys | join(", ")' models/model-manifest.json)"

      - name: Verify model directories exist
        run: |
          for cat in formula-det formula-rec text-det text-rec table-det table-struct; do
            if [ -d "models/$cat" ]; then
              echo "  OK: models/$cat ($(ls models/$cat/ | wc -l) variants)"
            else
              echo "  WARNING: models/$cat not found - may need external download"
            fi
          done

      - name: Run model verify
        if: success()
        run: |
          ./target/release/snipper models verify || {
            echo "::warning::Some models are not installed locally. CI will continue."
          }

  # ============================================================
  # Job 2: Package models into release ZIPs
  # ============================================================
  package:
    name: Package models
    needs: check-models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package models (Unix)
        run: |
          mkdir -p release_models
          # Package formula detection
          if [ -d models/formula-det/yolov8-mfd ]; then
            cd models/formula-det && zip -r ../../release_models/latexsnipper-formula-det.zip yolov8-mfd/ && cd ../..
            sha256sum release_models/latexsnipper-formula-det.zip | cut -d' ' -f1 > release_models/latexsnipper-formula-det.zip.sha256
          fi
          # Package formula recognition
          if [ -d models/formula-rec/trocr-deit ]; then
            cd models/formula-rec && zip -r ../../release_models/latexsnipper-formula-rec.zip trocr-deit/ && cd ../..
            sha256sum release_models/latexsnipper-formula-rec.zip | cut -d' ' -f1 > release_models/latexsnipper-formula-rec.zip.sha256
          fi
          # Package text detection
          if [ -d models/text-det/v6-small ]; then
            cd models/text-det && zip -r ../../release_models/latexsnipper-text-det.zip v6-small/ && cd ../..
            sha256sum release_models/latexsnipper-text-det.zip | cut -d' ' -f1 > release_models/latexsnipper-text-det.zip.sha256
          fi
          # Package text recognition
          if [ -d models/text-rec/v6-small ]; then
            cd models/text-rec && zip -r ../../release_models/latexsnipper-text-rec.zip v6-small/ && cd ../..
            sha256sum release_models/latexsnipper-text-rec.zip | cut -d' ' -f1 > release_models/latexsnipper-text-rec.zip.sha256
          fi
          # Package table detection
          if [ -d models/table-det/tatr-detection ]; then
            cd models/table-det && zip -r ../../release_models/latexsnipper-table-det.zip tatr-detection/ && cd ../..
            sha256sum release_models/latexsnipper-table-det.zip | cut -d' ' -f1 > release_models/latexsnipper-table-det.zip.sha256
          fi
          # Package table structure
          if [ -d models/table-struct/tatr-structure ]; then
            cd models/table-struct && zip -r ../../release_models/latexsnipper-table-struct.zip tatr-structure/ && cd ../..
            sha256sum release_models/latexsnipper-table-struct.zip | cut -d' ' -f1 > release_models/latexsnipper-table-struct.zip.sha256
          fi
          echo "Packaged models:"
          ls -la release_models/

      - name: Generate SHA256SUMS
        run: |
          cd release_models
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Update manifest checksums
        run: |
          # Generate checksums block for manifest
          CHECKSUMS=$(cat release_models/SHA256SUMS | while read hash file; do
            echo "    \"$file\": \"$hash\","
          done)
          echo "Computed checksums for $(echo "$CHECKSUMS" | wc -l) files"

      - name: Upload model assets
        uses: actions/upload-artifact@v4
        with:
          name: model-zips
          path: release_models/*.zip

      - name: Upload checksum artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-checksums
          path: |
            release_models/SHA256SUMS
            release_models/*.sha256

  # ============================================================
  # Job 3: Smoke test — download, verify, and run inference
  # ============================================================
  smoke-test:
    name: Smoke test
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-zips
          path: test_models

      - name: Build CLI
        run: cargo build --release -p latexsnipper-cli

      - name: Smoke test — extract and verify path structure
        run: |
          cd test_models
          # Extract each ZIP and verify expected file layout
          for zip in *.zip; do
            echo "Testing: $zip"
            unzip -q "$zip" -d extracted
            # Verify the variant directory contains model files
            find extracted -name "*.onnx" -o -name "config.json" | head -5
            rm -rf extracted
          done

      - name: Smoke test — models verify (if formula model available)
        run: |
          echo "Note: Full inference smoke test requires ONNX Runtime and model files."
          echo "        Run manually with: snipper models verify"

  # ============================================================
  # Job 4: Create Release
  # ============================================================
  create-release:
    name: Create GitHub Release
    needs: [check-models, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            TAG="${{ inputs.version_override }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Download model assets
        uses: actions/download-artifact@v4
        with:
          name: model-zips
          path: release_assets

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: model-checksums
          path: release_assets

      - name: Copy manifest
        run: cp models/model-manifest.json release_assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Models ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          body: |
            ## Model Packages

            Six model packages for LaTeXSnipper Core. Each ZIP is self-contained with the
            model variant directory at the root (single directory per ZIP).

            ### SHA-256 Integrity

            All ZIP files are verified with SHA-256. Each asset's checksum is recorded in
            `SHA256SUMS` and in the `model-manifest.json` checksums section.

            ### Installation

            ```bash
            # Install CLI
            cargo install latexsnipper-cli

            # Download models
            snipper models download --manifest-url https://github.com/strangelion/latexsnipper-core/releases/download/${{ steps.tag.outputs.tag }}/model-manifest.json --all

            # Verify
            snipper models verify
            ```

            ### Model Support Status

            | Model | Status | Default |
            |---|---|---|
            | YOLOv8-MFD (formula-det) | Stable | Yes |
            | TrOCR-DeiT (formula-rec) | Stable | Yes |
            | TATR Detection (table-det) | Experimental | No |
            | TATR Structure (table-struct) | Experimental | No |
            | v6-small (text-det/rec) | Experimental | No |

          files: |
            release_assets/*.zip
            release_assets/SHA256SUMS
            release_assets/model-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
