name: Model Release

on:
  push:
    tags:
      - 'models-v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version tag override (e.g. models-v2.0.0)'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # Job 1: Package models into release ZIPs
  # ============================================================
  package:
    name: Package models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            TAG="${{ inputs.version_override }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#models-v}" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Verify manifest template exists
        run: |
          if [ ! -f scripts/model-manifest.template.json ]; then
            echo "ERROR: scripts/model-manifest.template.json not found"
            exit 1
          fi
          echo "Manifest template OK"

      - name: Acquire model sources from release tag
        run: |
          BASE_TAG="models-v2.0.0"
          echo "Downloading model ZIPs from $BASE_TAG release..."
          mkdir -p models

          for zip_name in \
            latexsnipper-formula-det.zip \
            latexsnipper-formula-rec.zip \
            latexsnipper-text-det.zip \
            latexsnipper-text-rec.zip \
            latexsnipper-table-det.zip \
            latexsnipper-table-struct.zip; do

            URL="https://github.com/strangelion/latexsnipper-core/releases/download/$BASE_TAG/$zip_name"
            echo "Downloading $zip_name..."
            curl -fsSL -o "$zip_name" "$URL" || {
              echo "FAIL: Could not download $zip_name from $BASE_TAG"
              echo "Ensure the $BASE_TAG release exists with all model assets."
              exit 1
            }
            unzip -q -o "$zip_name" -d models/
            rm -f "$zip_name"
          done

          # Verify all 6 category directories exist
          count=0
          for cat in formula-det formula-rec text-det text-rec table-det table-struct; do
            if [ -d "models/$cat" ]; then
              count=$((count + 1))
              echo "  OK: models/$cat"
            fi
          done
          if [ "$count" -ne 6 ]; then
            echo "FAIL: Only $count/6 model categories extracted."
            exit 1
          fi
          echo "All 6 model categories acquired."

      - name: Package models (Unix)
        run: |
          mkdir -p release_models
          count=0
          for cat_pair in "formula-det:yolov8-mfd" "formula-rec:trocr-deit" "text-det:v6-small" "text-rec:v6-small" "table-det:tatr-detection" "table-struct:tatr-structure"; do
            IFS=":" read -r cat variant <<< "$cat_pair"
            if [ -d "models/$cat/$variant" ]; then
              cd "models/$cat" && zip -r "../../release_models/latexsnipper-$cat.zip" "$variant/" && cd ../..
              count=$((count + 1))
            else
              echo "WARNING: models/$cat/$variant not found, skipping"
            fi
          done
          # Assert exactly 6 models were packaged
          if [ "$count" -ne 6 ]; then
            echo "FAIL: Only $count/6 model packages built. All 6 categories required."
            exit 1
          fi
          echo "Packaged $count/6 models"

      - name: Generate SHA256SUMS
        run: |
          cd release_models
          ls *.zip > /dev/null 2>&1 || { echo "FAIL: No ZIP files found"; exit 1; }
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Generate final model-manifest.json with checksums
        run: |
          # Parse SHA256SUMS into a JSON object: {"file.zip": "sha256", ...}
          CHECKSUMS=$(jq -c -Rn '
            reduce inputs as $line
              ({};
               ($line | capture("^(?<sha>[0-9A-Fa-f]{64})\\s+\\*?(?<file>.+)$"))
               as $m
               | .[$m.file] = ($m.sha | ascii_downcase)
              )
          ' < release_models/SHA256SUMS)

          VERSION="${{ steps.tag.outputs.version }}"
          TAG="${{ steps.tag.outputs.tag }}"
          BASE_URL="https://github.com/strangelion/latexsnipper-core/releases/download/$TAG"
          MIRRORS=$(echo "[\"https://gh.zwy.one/$BASE_URL\",\"https://gh.xxooo.cf/$BASE_URL\"]" | jq -c '.')

          jq \
            --arg version "$VERSION" \
            --arg baseUrl "$BASE_URL" \
            --argjson mirrors "$MIRRORS" \
            --argjson checksums "$CHECKSUMS" \
            '.version = $version | .baseUrl = $baseUrl | .mirrors = $mirrors | .checksums = $checksums' \
            scripts/model-manifest.template.json > release_models/model-manifest.json

          echo "Generated manifest checksums:"
          jq -r '.checksums | to_entries[] | "\(.key): \(.value)"' release_models/model-manifest.json
          echo "Version: $(jq -r .version release_models/model-manifest.json)"
          echo "Base URL: $(jq -r .baseUrl release_models/model-manifest.json)"

      - name: Upload model assets
        uses: actions/upload-artifact@v4
        with:
          name: model-zips
          path: release_models/*.zip

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            release_models/SHA256SUMS
            release_models/model-manifest.json

  # ============================================================
  # Job 2: Smoke test — extract, verify path structure, validate manifest
  # ============================================================
  smoke-test:
    name: Smoke test
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-zips
          path: test_models

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: test_metadata

      - name: Smoke test — extract and verify path structure
        run: |
          cd test_models
          for zip in *.zip; do
            echo "Testing: $zip"
            unzip -q "$zip" -d extracted
            # Verify the variant directory contains model files (should have at least config.json)
            found=$(find extracted -name "config.json" | wc -l)
            if [ "$found" -eq 0 ]; then
              echo "FAIL: $zip has no config.json!"
              exit 1
            fi
            echo "  OK: $found config.json(s)"
            rm -rf extracted
          done

      - name: Smoke test — validate manifest checksums
        run: |
          cat test_metadata/SHA256SUMS
          # Verify that every ZIP in SHA256SUMS exists
          while read -r hash file; do
            if [ ! -f "test_models/$file" ]; then
              echo "FAIL: $file from SHA256SUMS not found!"
              exit 1
            fi
            echo "  OK: $file"
          done < test_metadata/SHA256SUMS

  # ============================================================
  # Job 3: Create Release (only if packaging and smoke test both pass)
  # ============================================================
  create-release:
    name: Create GitHub Release
    needs: [package, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            TAG="${{ inputs.version_override }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Download model assets
        uses: actions/download-artifact@v4
        with:
          name: model-zips
          path: release_assets

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release_assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Models ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          body: |
            ## Model Packages

            Six model packages for LaTeXSnipper Core. Each ZIP is self-contained with the
            model variant directory at the root (single directory per ZIP).

            ### SHA-256 Integrity

            All ZIP files are verified with SHA-256. Each asset's checksum is recorded in
            `SHA256SUMS` and in the `model-manifest.json` checksums section.

            ### Installation

            ```bash
            # Install CLI
            cargo install latexsnipper-cli

            # Download models
            snipper models download --manifest-url https://github.com/strangelion/latexsnipper-core/releases/download/${{ steps.tag.outputs.tag }}/model-manifest.json --all

            # Verify
            snipper models verify
            ```

            ### Model Support Status

            | Model | Status | Default |
            |---|---|---|
            | YOLOv8-MFD (formula-det) | Stable | Yes |
            | TrOCR-DeiT (formula-rec) | Stable | Yes |
            | TATR Detection (table-det) | Experimental | No |
            | TATR Structure (table-struct) | Experimental | No |
            | v6-small (text-det/rec) | Experimental | No |

          files: |
            release_assets/*.zip
            release_assets/SHA256SUMS
            release_assets/model-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
