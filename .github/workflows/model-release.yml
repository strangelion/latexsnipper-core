name: Model Release

on:
  push:
    tags:
      - 'models-v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version tag override (e.g. models-v2.0.0)'
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # Job 1: Package models into release ZIPs
  # ============================================================
  package:
    name: Package models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            TAG="${{ inputs.version_override }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#models-v}" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Verify manifest template exists
        run: |
          if [ ! -f scripts/model-manifest.template.json ]; then
            echo "ERROR: scripts/model-manifest.template.json not found"
            exit 1
          fi
          echo "Manifest template OK"

      - name: Discover all model variants from manifest
        id: variants
        run: |
          # Parse manifest to extract all (category, variant_id, zipFile) tuples
          VARIANTS=$(jq -r '
            .categories | to_entries[] |
            .key as $cat |
            (.value.variants[] | "\($cat):\(.id):\(.zipFile)")
          ' scripts/model-manifest.template.json)
          echo "Discovered variants:"
          echo "$VARIANTS"
          # Store as newline-separated list for subsequent steps
          echo "$VARIANTS" > /tmp/variants.txt
          echo "count=$(wc -l < /tmp/variants.txt)" >> $GITHUB_OUTPUT

      - name: Download and extract model ZIPs
        run: |
          mkdir -p models
          while IFS=: read -r cat variant zip_name; do
            echo "---"
            echo "Processing: cat=$cat variant=$variant zip=$zip_name"

            # Try to get sourceUrl from manifest
            SOURCE_URL=$(jq -r --arg cat "$cat" --arg var "$variant" '
              .categories[$cat].variants[] | select(.id == $var) | .sourceUrl // empty
            ' scripts/model-manifest.template.json)

            if [ -n "$SOURCE_URL" ]; then
              URL="$SOURCE_URL"
            else
              BASE_TAG="models-v2.0.0"
              URL="https://github.com/strangelion/latexsnipper-core/releases/download/$BASE_TAG/$zip_name"
            fi

            echo "Downloading $zip_name from $URL ..."
            curl -fsSL -o "$zip_name" "$URL" || {
              echo "WARNING: Could not download $zip_name"
              echo "Creating placeholder directory for models/$cat/$variant"
              mkdir -p "models/$cat/$variant"
              continue
            }
            tmp="$(mktemp -d)"
            unzip -q -o "$zip_name" -d "$tmp"
            # Find the variant directory inside the extracted ZIP
            variant_dir="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | head -1)"
            if [ -n "$variant_dir" ]; then
              mv "$variant_dir" "models/$cat/$variant"
            else
              # ZIP with no subdirectory (flat layout)
              mkdir -p "models/$cat/$variant"
              find "$tmp" -type f -exec mv {} "models/$cat/$variant/" \;
            fi
            rm -rf "$tmp" "$zip_name"
            echo "  OK: models/$cat/$variant"
          done < /tmp/variants.txt

      - name: Package each variant as separate ZIP
        run: |
          mkdir -p release_models
          count=0
          while IFS=: read -r cat variant zip_name; do
            if [ -d "models/$cat/$variant" ]; then
              # Use canonical zip name from manifest
              output_zip="release_models/$zip_name"
              cd "models/$cat" && zip -r "../../$output_zip" "$variant/" && cd ../..
              count=$((count + 1))
              echo "Packaged: $output_zip"
            else
              echo "WARNING: models/$cat/$variant not found, skipping"
            fi
          done < /tmp/variants.txt
          echo "Packaged $count model ZIP(s)"

      - name: Generate SHA256SUMS
        run: |
          cd release_models
          ls *.zip > /dev/null 2>&1 || { echo "FAIL: No ZIP files found"; exit 1; }
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Generate final model-manifest.json with checksums
        run: |
          CHECKSUMS=$(jq -c -Rn '
            reduce inputs as $line
              ({};
               ($line | capture("^(?<sha>[0-9A-Fa-f]{64})\\s+\\*?(?<file>.+)$"))
               as $m
               | .[$m.file] = ($m.sha | ascii_downcase)
              )
          ' < release_models/SHA256SUMS)

          VERSION="${{ steps.tag.outputs.version }}"
          TAG="${{ steps.tag.outputs.tag }}"
          BASE_URL="https://github.com/strangelion/latexsnipper-core/releases/download/$TAG"
          MIRRORS=$(echo "[\"https://gh.zwy.one/$BASE_URL\",\"https://gh.xxooo.cf/$BASE_URL\"]" | jq -c '.')

          jq \
            --arg version "$VERSION" \
            --arg baseUrl "$BASE_URL" \
            --argjson mirrors "$MIRRORS" \
            --argjson checksums "$CHECKSUMS" \
            '.version = $version | .baseUrl = $baseUrl | .mirrors = $mirrors | .checksums = $checksums' \
            scripts/model-manifest.template.json > release_models/model-manifest.json

          echo "Generated manifest checksums:"
          jq -r '.checksums | to_entries[] | "\(.key): \(.value)"' release_models/model-manifest.json
          echo "Version: $(jq -r .version release_models/model-manifest.json)"
          echo "Base URL: $(jq -r .baseUrl release_models/model-manifest.json)"

      - name: Upload model assets
        uses: actions/upload-artifact@v4
        with:
          name: model-zips
          path: release_models/*.zip

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            release_models/SHA256SUMS
            release_models/model-manifest.json

  # ============================================================
  # Job 2: Smoke test — dynamic per-manifest
  # ============================================================
  smoke-test:
    name: Smoke test
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-zips
          path: test_models

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: test_metadata

      - name: Discover expected ZIPs from manifest
        id: expected
        run: |
          # Collect all zipFile values from manifest
          jq -r '
            .categories[] | .variants[] | .zipFile
          ' scripts/model-manifest.template.json | sort > /tmp/expected_zips.txt
          echo "Expected ZIPs ($(wc -l < /tmp/expected_zips.txt)):"
          cat /tmp/expected_zips.txt

      - name: Smoke test — verify each ZIP exists and has config.json
        run: |
          cd test_models
          failures=0
          while IFS= read -r zip; do
            if [ ! -f "$zip" ]; then
              echo "FAIL: $zip not found in artifacts!"
              failures=$((failures + 1))
              continue
            fi
            echo "Testing: $zip"
            unzip -q "$zip" -d extracted
            found=$(find extracted -name "config.json" | wc -l)
            if [ "$found" -eq 0 ]; then
              echo "FAIL: $zip has no config.json!"
              failures=$((failures + 1))
            else
              echo "  OK: $found config.json(s)"
            fi
            rm -rf extracted
          done < /tmp/expected_zips.txt
          if [ "$failures" -gt 0 ]; then
            echo "FAIL: $failures ZIP(s) failed smoke test"
            exit 1
          fi
          echo "All ZIPs passed smoke test"

      - name: Smoke test — validate manifest checksums
        run: |
          cat test_metadata/SHA256SUMS
          while read -r hash file; do
            if [ ! -f "test_models/$file" ]; then
              echo "FAIL: $file from SHA256SUMS not found!"
              exit 1
            fi
            echo "  OK: $file"
          done < test_metadata/SHA256SUMS

  # ============================================================
  # Job 3: Create Release
  # ============================================================
  create-release:
    name: Create GitHub Release
    needs: [package, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            TAG="${{ inputs.version_override }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Download model assets
        uses: actions/download-artifact@v4
        with:
          name: model-zips
          path: release_assets

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release_assets

      - name: Generate dynamic release body
        id: release_body
        run: |
          # Build model support table from manifest
          TABLE="| Category | Variant | Status |\n|---|---|---|"
          jq -r '
            .categories | to_entries[] |
            .key as $cat |
            (.value.variants[] |
              "\($cat) | \(.id) | experimental"
            )
          ' scripts/model-manifest.template.json |
          while IFS="|" read -r line; do
            TABLE="$TABLE\n| $(echo $line | xargs) |"
          done

          # Generate full body
          BODY=$(cat <<ENDBODY
          ## Model Packages

          Each ZIP is self-contained with the model variant directory at the root.

          ### SHA-256 Integrity

          All ZIP files are verified with SHA-256. Each asset's checksum is recorded in
          \`SHA256SUMS\` and in the \`model-manifest.json\` checksums section.

          ### Model Packages

          | Category | Variant | Status |
          |---|---|---|
          $(jq -r '.categories | to_entries[] | .key as $cat | (.value.variants[] | "\($cat) | \(.id) | experimental")' scripts/model-manifest.template.json | sed 's/^/| /' | sed 's/$/ |/')
          ENDBODY
          )

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Models ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          body: |
            ## Model Packages

            Each ZIP is self-contained with the model variant directory at the root.

            ### SHA-256 Integrity

            All ZIP files are verified with SHA-256. Each asset's checksum is recorded in
            `SHA256SUMS` and in the `model-manifest.json` checksums section.

            ### Model Packages

            | Category | Variant | Status |
            |---|---|---|
            $(jq -r '.categories | to_entries[] | .key as $cat | (.value.variants[] | "\($cat) | \(.id) | experimental")' scripts/model-manifest.template.json)

          files: |
            release_assets/*.zip
            release_assets/SHA256SUMS
            release_assets/model-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
