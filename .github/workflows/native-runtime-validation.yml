name: Native Runtime Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Level 1: Contract ────────────────────────────────────────────
  # Always executes. Validates that every runtime crate compiles and
  # its public API tests pass without requiring an actual SDK.

  contracts:
    name: Runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test --locked -p latexsnipper-runtime-paddle
      - run: cargo test --locked -p latexsnipper-runtime-executorch
      - run: cargo test --locked -p latexsnipper-runtime-tensorrt
      - run: cargo test --locked -p latexsnipper-runtime-plugin-api

  coreml:
    name: Core ML contract
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: >
          cargo test --locked
          -p latexsnipper-runtime-coreml
          --all-targets

  catalog:
    name: Model catalog integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: >
          cargo test --locked
          -p latexsnipper-runtime
          --test model_catalog_runtime_variants

  # ── Level 2: Runtime parity ──────────────────────────────────────
  # Executes only when SDK archive URLs are configured in repository
  # variables. Verifies real SDK-backed inference against oracle output.

  paddle-parity:
    name: Paddle Inference parity
    if: ${{ vars.PADDLE_RUNTIME_URL != '' && vars.PPFN_MODEL_URL != '' }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PADDLE_RUNTIME_URL: ${{ vars.PADDLE_RUNTIME_URL }}
      PPFN_MODEL_URL: ${{ vars.PPFN_MODEL_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Download Paddle Runtime bundle (pre-built bridge + DLLs)
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output paddle-runtime.zip "$PADDLE_RUNTIME_URL"
          unzip -q paddle-runtime.zip -d target/paddle-runtime
          echo "LATEXSNIPPER_PADDLE_HOME=${{ github.workspace }}/target/paddle-runtime" >> "$GITHUB_ENV"

      - name: Download PP-FormulaNet-S model
        shell: bash
        run: |
          mkdir -p test-models/formula-rec
          curl --fail --location --retry 3 \
            --output ppfn.zip "$PPFN_MODEL_URL"
          unzip -q ppfn.zip -d test-models/formula-rec

      - name: Install oracle Python dependencies
        run: |
          python -m pip install numpy pillow tokenizers

      - name: Run PP-FormulaNet Paddle parity
        run: >
          python scripts/validate_ppfn_paddle_parity.py
          --runtime-home target/paddle-runtime
          --model-home test-models/formula-rec/pp-formulanet-s
          --count 20
          --output target/paddle-parity.json

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paddle-parity-report
          path: target/paddle-parity.json
          if-no-files-found: warn
          retention-days: 14

  executorch-parity:
    name: ExecuTorch parity
    if: ${{ vars.EXECUTORCH_RUNTIME_URL != '' && vars.EXECUTORCH_TEST_MODEL_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXECUTORCH_RUNTIME_URL: ${{ vars.EXECUTORCH_RUNTIME_URL }}
      EXECUTORCH_TEST_MODEL_URL: ${{ vars.EXECUTORCH_TEST_MODEL_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Download ExecuTorch Runtime bundle (pre-built bridge + libs)
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output executorch.tar.gz "$EXECUTORCH_RUNTIME_URL"
          mkdir -p target/executorch-runtime
          tar xzf executorch.tar.gz -C target/executorch-runtime
          echo "LATEXSNIPPER_EXECUTORCH_HOME=${{ github.workspace }}/target/executorch-runtime" >> "$GITHUB_ENV"

      - name: Download .pte program
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output test-model.pte "$EXECUTORCH_TEST_MODEL_URL"
          echo "LATEXSNIPPER_EXECUTORCH_PROGRAM=${{ github.workspace }}/test-model.pte" >> "$GITHUB_ENV"

      - name: Run ExecuTorch XNNPACK smoke
        run: >
          cargo test --locked
          -p latexsnipper-runtime-executorch
          --test native_runtime
          xnnpack_program_runs_named_methods_without_python
          -- --exact --nocapture

  # ── Level 3: Hardware parity ─────────────────────────────────────
  # Only executes on self-hosted runners with the required GPU.
  # Skipped (not failed) when the runner is not available.

  tensorrt-hardware:
    name: TensorRT on GPU
    if: ${{ vars.ENABLE_TENSORRT_SELF_HOSTED == 'true' }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - nvidia
      - gpu
    timeout-minutes: 30
    env:
      LATEXSNIPPER_TENSORRT_TEST_RUNTIME: ${{ vars.TENSORRT_RUNTIME_PATH }}
      LATEXSNIPPER_TENSORRT_TEST_MODEL: ${{ vars.TENSORRT_TEST_MODEL_PATH }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify GPU health
        run: nvidia-smi
      - name: Run TensorRT native parity
        run: >
          cargo test --locked
          -p latexsnipper-runtime-tensorrt
          --test native_runtime
          native_tensorrt_matches_onnx_cpu_when_test_runtime_is_configured
          -- --exact --nocapture

  tensorrt-rtx-hardware:
    name: TensorRT-RTX on GPU
    if: ${{ vars.ENABLE_TENSORRT_SELF_HOSTED == 'true' }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - nvidia
      - gpu
    timeout-minutes: 30
    env:
      LATEXSNIPPER_TENSORRT_RTX_TEST_RUNTIME: ${{ vars.TENSORRT_RTX_RUNTIME_PATH }}
      LATEXSNIPPER_TENSORRT_RTX_TEST_MODEL: ${{ vars.TENSORRT_RTX_TEST_MODEL_PATH }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify GPU health
        run: nvidia-smi
      - name: Run TensorRT-RTX native parity
        run: >
          cargo test --locked
          -p latexsnipper-runtime-tensorrt
          --test native_runtime
          tensorrt_rtx_matches_onnx_cpu_when_test_runtime_is_configured
          -- --exact --nocapture
